gate: P10-GL1
protocol: research/writable_neural_memory_p10/gl1/gl1_protocol_v0.3.md
seal:
  sha256sums: configs/p10_gl1_SHA256SUMS
data:
  source: OmniAnomaly ServerMachineDataset/train/<machine>.txt (train split only)
  manifest: research/writable_neural_memory_p10/gl1/gl1_data_manifest.csv
  primary_machines:
  - machine-3-7
  - machine-1-6
  - machine-2-7
  - machine-3-5
  - machine-2-9
  - machine-1-3
  reserve_machines:
  - machine-2-6
  - machine-3-9
  - machine-2-2
  excluded_from_primary:
  - machine-1-4
  - machine-2-1
  - machine-1-8
  machine_draw_seed: 20261002
  fit_fraction: 0.5
  train_fraction_of_fit: 0.8
  near_constant_sd: 0.001
  zscore_sd_floor: 0.02
  unit_floor: 0.05
  open_test_or_labels: false
models:
  primary: mlstm
  replications:
  - gdeltanet
  - titans
  references_trained:
  - lstm
  - mlstm_std
  references_untrained:
  - knn_append
  reset_period_R: 100
  param_budget:
  - 60000
  - 80000
  arch:
    mlstm:
      d: 128
      heads: 4
      dk: 32
      dv: 32
      chunk: 64
      forget_gate: sigmoid
      input_gate: sigmoid
      forget_bias_init:
      - 3.0
      - 6.0
      input_bias_init: 0.0
      normalizer: max(|n.q|,1)
      qk_norm: k scaled by 1/sqrt(dk)
    gdeltanet:
      d: 128
      heads: 4
      dk: 32
      dv: 32
      chunk: 64
      alpha_gate: sigmoid
      beta_gate: sigmoid
      alpha_bias_init:
      - 3.0
      - 6.0
      beta_bias_init: 0.0
      qk_norm: L2
    titans:
      d: 128
      dm: 64
      mem_hidden: 192
      chunk: 16
      retrieval: memory at chunk start
      grad: analytic, w.r.t. memory at chunk start
      eta_bias_init: 2.0
      theta_scale: 0.1
      theta_bias_init: 0.0
      alpha_bias_init: -5.0
      key_norm: L2
      loss: mean squared ||M(k)-v||^2
    lstm:
      d: 64
      hidden: 96
      forget_bias_init: 1.0
    window_only:
      K: 100
      hidden_rule: floor((70000-C)/(K*C+1+C))
training:
  seq_len: 2048
  batch: 8
  stateful_tbptt: true
  drift_augmentation: false
  window_batch: 64
  lr: 0.001
  grad_clip: 1.0
  max_iters: 4000
  eval_every: 200
  patience: 5
  seeds:
  - 11
  - 22
  - 33
g0:
  positions_per_machine: 12
  impulse_u: 3.0
  impulse_channels: 8
  max_lag: 2048
  warmup: 1024
  ref_lags: 16
  unstable_factor: 2.0
  null_quantile: 0.999
  min_measurable_positions: 8
  pass_h05_min: 400
  pass_min_machines: 4
utility:
  families:
    level:
      magnitude_sigma: 2.0
    ramp:
      magnitude_sigma: 2.0
      ramp_steps: 512
    gain:
      factor: 1.5
  drift_channels: 8
  episodes_per_family: 24
  onset_seed: 902
  calibration_len: 1024
  eval_len: 1024
  min_warmup: 1024
  threshold_quantile: 0.99
  pass_delta_fpr_max: -0.02
  pass_min_families: 2
sentinel:
  types:
    spike:
      amp_u: 2.0
      channels: 5
      length: 30
    stuck:
      channels: 6
      length: 30
    corr_break:
      channels: 6
      length: 30
  offsets:
    spike: 256
    stuck: 512
    corr_break: 768
  seed: 903
  detect_quantile: 0.95
  noninferiority_margin: 0.02
  large_degradation_flag: 0.1
stability:
  nodrift_delta_fpr_upper_max: 0.01
  state_norm_blowup_factor: 100
validity:
  val_mse_max_ratio_vs_window_only: 1.5
  parity_tol: 0.0001
  min_valid_machines: 4
  min_valid_seeds_per_machine: 2
knn:
  window: 8
  exclusion: 8
  bank_stride: 4
eval:
  window_batch: 2048
  window_batch_titans: 256
stats:
  bootstrap: hierarchical_machine_seed_episode
  B: 10000
  bootstrap_seed: 901
dry_run:
  N: 4000
  C: 5
dry_run_overrides:
  training.seq_len: 128
  training.max_iters: 6
  training.eval_every: 3
  training.seeds:
  - 11
  - 22
  training.window_batch: 16
  g0.positions_per_machine: 3
  g0.max_lag: 128
  g0.warmup: 64
  g0.min_measurable_positions: 2
  g0.pass_h05_min: 40
  utility.episodes_per_family: 2
  utility.calibration_len: 128
  utility.eval_len: 256
  utility.min_warmup: 64
  sentinel.offsets:
    spike: 32
    stuck: 96
    corr_break: 160
  stats.B: 200
  eval.window_batch: 512
  eval.window_batch_titans: 64
