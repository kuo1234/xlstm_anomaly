# P10 G-L1 config DRAFT (not sealed)
gate: P10-GL1
data:
  source: OmniAnomaly/ServerMachineDataset/train   # train split only
  primary_machines: [machine-3-7, machine-1-6, machine-2-7, machine-3-5, machine-2-9, machine-1-3]
  reserve_machines: [machine-2-6, machine-3-9, machine-2-2]
  excluded_from_primary: [machine-1-4, machine-2-1, machine-1-8]
  machine_draw_seed: 20261002
  fit_fraction: 0.5
  train_fraction_of_fit: 0.8
  near_constant_sd: 1.0e-3
  zscore_sd_floor: 0.02
  open_test_or_labels: false
models:
  primary: mlstm
  replications: [gdeltanet, titans]
  references: [lstm, window_only, knn_append, mlstm_std]
  param_budget: [60000, 80000]
  reset_period_R: 100
training:
  seq_len: 2048
  batch: 8
  stateful_tbptt: true
  drift_augmentation: false
  optimizer: adam
  lr: 1.0e-3
  grad_clip: 1.0
  max_iters: 4000
  eval_every: 200
  patience: 5
  seeds: [11, 22, 33]
g0:
  positions_per_machine: 12
  impulse_u: 3
  impulse_channels: 8
  pass_h05_min: 400          # = 4R
  pass_min_machines: 4
utility:
  families:
    level: {magnitude_sigma: 2.0, channels: 8}
    ramp: {magnitude_sigma: 2.0, ramp_steps: 512, channels: 8}
    gain: {factor: 1.5, channels: 8}
  episodes_per_family: 24
  onset_seed: 902
  calibration_len: 1024
  eval_len: 1024
  threshold_quantile: 0.99
  pass_delta_fpr_max: -0.02
  pass_min_families: 2
sentinel:
  types:
    spike: {amp_u: 2, channels: 5, length: 30}
    stuck: {channels: 6, length: 30}
    corr_break: {channels: 6, length: 30}
  detect_quantile: 0.95
  noninferiority_margin: 0.02
stability:
  nodrift_delta_fpr_upper_max: 0.01
  state_norm_blowup_factor: 100
validity:
  val_mse_max_ratio_vs_window_only: 1.5
  parity_tol: 1.0e-4
  min_valid_machines: 4
  min_valid_seeds_per_machine: 2
stats:
  bootstrap: hierarchical_machine_seed_episode
  B: 10000
  bootstrap_seed: 901
